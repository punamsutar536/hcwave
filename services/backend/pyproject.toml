# -----------------------------------------------------------------------------
# hcwave backend – FastAPI API, queue worker and scheduled jobs for the
# Hospital AI Wave 1 platform. Cloud SDKs are optional extras so the same code
# runs on Azure (default), another cloud, or a laptop.
# -----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcwave"
version = "1.0.0"
description = "Hospital AI Wave 1 platform: WhatsApp assistant, reminders, report delivery, feedback and dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "tenacity>=8.5",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyjwt[crypto]>=2.9",
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.3",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "pgvector>=0.3",
]

[project.optional-dependencies]
# Azure adapters (default production target).
azure = [
  "azure-identity>=1.17",
  "azure-servicebus>=7.12",
  "azure-communication-messages>=1.1",
  "azure-communication-email>=1.0",
  "azure-communication-sms>=1.1",
  "azure-storage-blob>=12.20",
  "azure-search-documents>=11.5",
  "azure-monitor-opentelemetry>=1.6",
]
# Portable adapters used when running on another cloud or on-premises.
portable = [
  "redis>=5.0",
  "boto3>=1.34",
  "opentelemetry-exporter-otlp>=1.27",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
hcwave-api = "hcwave.api.serve:main"
hcwave-worker = "hcwave.worker.main:main"
hcwave-jobs = "hcwave.jobs.cli:main"
hcwave-knowledge = "hcwave.knowledge.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hcwave = ["api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Google style: pycodestyle, pyflakes, isort, naming, docstrings, bugbear, simplify.
select = ["E", "F", "W", "I", "N", "D", "B", "SIM", "UP", "S", "ASYNC"]
# E501: line length is enforced by `ruff format`; long SQL/text literals are kept intact.
ignore = ["D105", "D107", "S101", "S311", "D203", "D213", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]
"migrations/**" = ["D", "N", "S608"]
