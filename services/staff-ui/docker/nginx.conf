# Unprivileged nginx serving the static staff UI on :8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Power BI embeds load from app.powerbi.com; MSAL talks to login.microsoftonline.com.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://login.microsoftonline.com ${CSP_CONNECT_SRC}; frame-src https://app.powerbi.com ${CSP_FRAME_SRC}; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location = /config.js { alias /tmp/config.js; add_header Cache-Control "no-store"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /healthz { access_log off; return 200 "ok"; }
  location / { try_files $uri /index.html; }
}
