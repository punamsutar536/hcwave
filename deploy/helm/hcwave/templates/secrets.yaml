{{- if eq .Values.secrets.provider "kubernetes" }}
# Plain Kubernetes Secret – local clusters only. Production uses Key Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName }}
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets.kubernetes.values }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- else if eq .Values.secrets.provider "azureKeyVault" }}
# Azure Key Vault → Secrets Store CSI driver (workload identity) → synced
# Kubernetes Secret consumed as environment variables. Rotation is automatic.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "hcwave.fullname" . }}-keyvault
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "secrets.azureKeyVault.keyvaultName is required" .Values.secrets.azureKeyVault.keyvaultName | quote }}
    tenantId: {{ required "secrets.azureKeyVault.tenantId is required" .Values.secrets.azureKeyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secrets.azureKeyVault.objects }}
        - |
          objectName: {{ .name }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.secretName }}
      type: Opaque
      data:
        {{- range .Values.secrets.azureKeyVault.objects }}
        - objectName: {{ .name }}
          key: {{ .env }}
        {{- end }}
{{- end }}
