{{- if .Values.networkPolicy.enabled }}
# Zero-trust inside the namespace: deny all ingress, then allow only what each
# component needs. Egress stays open to reach PaaS private endpoints and Entra
# ID; restrict it with Azure Firewall FQDN rules if required.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hcwave.fullname" . }}-default-deny
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Public API (webhooks, report portal, staff API) – reached via the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hcwave.fullname" . }}-api-public
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hcwave.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8000, protocol: TCP }
---
# Internal job API – only Logic Apps/Functions subnets and in-cluster jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hcwave.fullname" . }}-api-internal
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hcwave.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- range .Values.networkPolicy.internalApiAllowedCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - { port: 8001, protocol: TCP }
{{- if .Values.staffUi.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hcwave.fullname" . }}-staff-ui
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hcwave.selectorLabels" (dict "root" . "component" "staff-ui") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8080, protocol: TCP }
{{- end }}
{{- end }}
