{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hcwave.fullname" . }}-api
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hcwave.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if .Values.worker.keda.enabled }}
---
# KEDA scales workers on Service Bus backlog, authenticating with the same
# workload identity (no connection strings).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "hcwave.fullname" . }}-servicebus
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  podIdentity:
    provider: azure-workload
    identityId: {{ .Values.serviceAccount.workloadIdentity.clientId | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "hcwave.fullname" . }}-worker
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "hcwave.fullname" . }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicas }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicas }}
  cooldownPeriod: 120
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: {{ required "worker.keda.serviceBusNamespace is required" .Values.worker.keda.serviceBusNamespace | quote }}
        queueName: {{ .Values.worker.keda.queueName | quote }}
        messageCount: {{ .Values.worker.keda.messageCount | quote }}
      authenticationRef:
        name: {{ include "hcwave.fullname" . }}-servicebus
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hcwave.fullname" . }}-api
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "hcwave.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hcwave.fullname" . }}-worker
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "hcwave.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
