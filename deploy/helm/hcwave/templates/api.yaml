# FastAPI: public listener (:8000) behind the gateway/WAF and a private
# listener (:8001) for Logic Apps, Durable Functions and CronJobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hcwave.fullname" . }}-api
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "hcwave.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hcwave.podLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hcwave.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "hcwave.topologySpread" (dict "root" . "component" "api") | nindent 6 }}
      {{- include "hcwave.scheduling" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "hcwave.image" (dict "root" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["hcwave-api"]
          ports:
            - { name: http, containerPort: 8000 }
            - { name: internal, containerPort: 8001 }
          env:
            {{- include "hcwave.backendEnv" . | nindent 12 }}
          envFrom:
            {{- include "hcwave.backendEnvFrom" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "hcwave.backendVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "hcwave.backendVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hcwave.fullname" . }}-api
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hcwave.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# Internal job API. On AKS: internal load balancer with a static private IP
# reachable from the Logic Apps / Functions VNet-integrated subnets.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hcwave.fullname" . }}-api-internal
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
  {{- with .Values.api.internalService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- if $.Values.api.internalService.loadBalancerIP }}
    service.beta.kubernetes.io/azure-load-balancer-ipv4: {{ $.Values.api.internalService.loadBalancerIP | quote }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.api.internalService.type }}
  selector:
    {{- include "hcwave.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: internal, port: 8001, targetPort: internal }
