{{- if .Values.serviceAccount.create }}
# Identity of every hcwave pod. With workload identity enabled, AKS exchanges
# its token for Microsoft Entra tokens of the user-assigned identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hcwave.serviceAccountName" . }}
  labels:
    {{- include "hcwave.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ required "serviceAccount.workloadIdentity.clientId is required" .Values.serviceAccount.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.workloadIdentity.enabled }}
{{- end }}
