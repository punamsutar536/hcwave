<text x="24" y="34" font-size="20" font-weight="700" fill="#1f2933">Ports &amp; adapters – one YAML line per provider swap</text>
<text x="24" y="56" font-size="13" fill="#52606d">Domain services and the LangGraph agent depend only on abstract ports; cloud SDKs load lazily from the plugin registry (provider: &lt;name&gt; or module:Class).</text>
