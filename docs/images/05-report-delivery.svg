<text x="523.75" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2933">(HIS sync)</text>
<line x1="523.75" y1="118" x2="523.75" y2="678" stroke="#7b8794" stroke-dasharray="4 4"/>
<rect x="630.5" y="72" width="181.5" height="46" rx="9" fill="#e7f6ec" stroke="#1f8a4c" stroke-width="1.5"/>
<text x="721.25" y="92" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2933">PostgreSQL</text>
<line x1="721.25" y1="118" x2="721.25" y2="678" stroke="#7b8794" stroke-dasharray="4 4"/>
<rect x="828" y="72" width="181.5" height="46" rx="9" fill="#e6f1fb" stroke="#0b6bcb" stroke-width="1.5"/>
