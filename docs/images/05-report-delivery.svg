<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="698" viewBox="0 0 1640 698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1f2933">Secure report delivery – no PDFs in chat</text>
<text x="24" y="56" font-size="13" fill="#52606d">Verified, expiring link (48 h default) → OTP or date of birth → 5-minute user-delegation SAS. Every step written to the access audit log.</text>
