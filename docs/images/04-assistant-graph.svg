<rect x="860" y="470" width="200" height="70" rx="10" fill="#fff3e0" stroke="#c26a00" stroke-width="1.6"/><text x="960" y="494.5" text-anchor="middle" font-weight="600" font-size="14" fill="#1f2933">handover</text><text x="960" y="511.5" text-anchor="middle" font-size="12" fill="#52606d">queue for staff</text><text x="960" y="526.5" text-anchor="middle" font-size="12" fill="#52606d">takeover screen</text>
<rect x="560" y="470" width="200" height="70" rx="10" fill="#f2f4f7" stroke="#7b8794" stroke-width="1.6"/><text x="660" y="494.5" text-anchor="middle" font-weight="600" font-size="14" fill="#1f2933">static replies</text><text x="660" y="511.5" text-anchor="middle" font-size="12" fill="#52606d">medical-advice refusal</text><text x="660" y="526.5" text-anchor="middle" font-size="12" fill="#52606d">out of scope</text>
<rect x="1160" y="470" width="180" height="70" rx="10" fill="#e7f6ec" stroke="#1f8a4c" stroke-width="1.6"/><text x="1250" y="502" text-anchor="middle" font-weight="600" font-size="14" fill="#1f2933">send replies</text><text x="1250" y="519" text-anchor="middle" font-size="12" fill="#52606d">Messenger (policy)</text>
<text x="40" y="644" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Guardrails</text>
<text x="40" y="670" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• System prompts forbid medical advice, diagnosis, medication guidance and result interpretation; the intent model routes medical questions to a fixed refusal.</text>
<text x="40" y="692" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• FAQ answers use only retrieved hospital passages; the model must flag confidence – otherwise staff take over. Prompt text is never logged unless explicitly enabled.</text>
<text x="40" y="714" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Interactive messages drive anything structured (booking, rescheduling, feedback); the LLM is used only to understand free text and answer FAQs.</text>
<text x="40" y="736" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Self-harm signals produce a crisis helpline reply and immediate handover; emergencies reply with 108 + casualty directions in the patient's language.</text>
</svg>