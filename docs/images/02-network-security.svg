<text x="744" y="500" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">Identity model</text>
<text x="744" y="524" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• AKS pods: workload identity (federated service account) → Entra tokens</text>
<text x="744" y="544" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Logic Apps / Functions: user-assigned managed identities</text>
<text x="744" y="564" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• PostgreSQL: Entra token as password – no DB password exists</text>
<text x="744" y="584" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Storage: shared keys off; report links are user-delegation SAS</text>
<text x="744" y="604" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Key Vault (RBAC): only the app HMAC key and optional 3rd-party secrets</text>
<text x="744" y="624" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Staff: Entra ID SSO, app roles FrontOffice / PatientRelations / UnitHead / Admin</text>
<text x="744" y="644" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Internal job API: MI tokens, audience + allow-listed client IDs</text>
<text x="744" y="676" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">Data residency</text>
<text x="744" y="700" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• All stateful services in Central India; ACS data location India</text>
<text x="744" y="720" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Azure OpenAI in an India region with regional (Standard) deployments</text>
<text x="744" y="740" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">• Azure Policy restricts resource locations to India regions</text>
</svg>