# =============================================================================
# CI: lint, test and validate everything on every push / pull request.
# =============================================================================
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/backend/pyproject.toml }
      - run: pip install -e ".[azure,portable,dev]"
      - name: Lint (ruff, Google docstrings)
        run: ruff check src tests migrations && ruff format --check src tests migrations
      - name: Tests (PostgreSQL with RLS + pgvector)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hcwave_test
        run: pytest -q

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff -r requirements.txt
      - run: ruff check . && python -c "import function_app"

  staff-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/staff-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: services/staff-ui/package-lock.json }
      - run: npm ci
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build + lint
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          for p in infra/bicep/parameters/*.bicepparam; do HCWAVE_ADMIN_GROUP_ID=00000000-0000-0000-0000-000000000000 az bicep build-params --file "$p" --stdout > /dev/null; done
      - uses: azure/setup-helm@v4
        with: { version: v3.16.2 }
      - name: Helm lint + kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          CHART=deploy/helm/hcwave
          helm lint $CHART -f $CHART/values-local.yaml
          AZ="--set serviceAccount.workloadIdentity.clientId=x --set secrets.azureKeyVault.keyvaultName=kv --set secrets.azureKeyVault.tenantId=t --set worker.keda.serviceBusNamespace=ns"
          helm lint $CHART -f $CHART/values-azure.yaml $AZ
          for overlay in values-local.yaml values-azure.yaml; do
            helm template hcwave $CHART -f $CHART/$overlay $AZ | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: Logic Apps workflow JSON
        run: for f in workflows/logic-apps/*/workflow.json; do python -m json.tool "$f" > /dev/null; done

  images:
    runs-on: ubuntu-latest
    needs: [backend, staff-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f services/backend/Dockerfile -t hcwave/backend:ci .
      - name: Build staff UI image
        run: docker build -t hcwave/staff-ui:ci services/staff-ui
      - name: Scan images (Trivy, fail on critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hcwave/backend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
